[package]
name = "ms-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
proptest = "1.11.0"

[[test]]
name = "scope-schema-contract"
path = "../../tests/contract/scope_schema.rs"

[[test]]
name = "events-schema-contract"
path = "../../tests/contract/events_schema.rs"

[[test]]
name = "scope-properties"
path = "tests/scope_props.rs"
