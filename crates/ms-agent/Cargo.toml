[package]
name = "ms-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
http-body-util = "0.1.3"
http = "1.3.1"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
ms-proto = { path = "../ms-proto" }
ms-store = { path = "../ms-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "signal", "time"] }

[[bin]]
name = "microswarm-agent"
path = "src/main.rs"

[[test]]
name = "agent-boot"
path = "tests/boot.rs"

[[test]]
name = "model-client"
path = "tests/model.rs"

[[test]]
name = "mcp-adapter"
path = "tests/mcp.rs"

[[test]]
name = "permit-policy"
path = "tests/permit.rs"

[[test]]
name = "approval-binding"
path = "tests/approval_binding.rs"

[[test]]
name = "emitter"
path = "tests/emitter.rs"

[[test]]
name = "exit"
path = "tests/exit.rs"

[[test]]
name = "delegation-tools"
path = "tests/delegation.rs"
