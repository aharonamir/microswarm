[package]
name = "ms-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
http = "1.3.1"
http-body-util = "0.1.5"
futures-util = "0.3.34"
ms-runtime = { path = "../ms-runtime" }
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "service", "http1", "tokio"] }
serde_json = "1.0.145"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.6"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[lib]
path = "src/lib.rs"
