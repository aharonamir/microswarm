[package]
name = "ms-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ms-proto = { path = "../ms-proto" }
ms-store = { path = "../ms-store" }
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3.34"
http = "1.3.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "webpki-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "server", "service", "http1", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"

[lib]
path = "src/lib.rs"

[[bin]]
name = "microswarmd"
path = "src/main.rs"

[[test]]
name = "integration-harness"
path = "../../tests/integration/harness.rs"

[[test]]
name = "us1-single-agent"
path = "../../tests/integration/us1_single_agent.rs"

[[test]]
name = "us1-approval"
path = "../../tests/integration/us1_approval.rs"

[[test]]
name = "mount-escape"
path = "../../tests/adversarial/mount_escape.rs"

[[test]]
name = "foundational-config-i18n"
path = "tests/foundational.rs"

[[test]]
name = "no-secrets"
path = "../../tests/adversarial/no_secrets.rs"

[[test]]
name = "runtime-profile"
path = "tests/runtime_profile.rs"

[[test]]
name = "runtime-events"
path = "tests/runtime_events.rs"

[[test]]
name = "scope-install"
path = "tests/scope_install.rs"

[[test]]
name = "session-lifecycle"
path = "tests/session_lifecycle.rs"

[[test]]
name = "router"
path = "tests/router.rs"

[[test]]
name = "proxy"
path = "tests/proxy.rs"
