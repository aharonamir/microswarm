[package]
name = "ms-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ms-proto = { path = "../ms-proto" }
ms-store = { path = "../ms-store" }
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3.34"
http = "1.3.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "webpki-tokio", "ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "server", "service", "http1", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"

[lib]
path = "src/lib.rs"

[[bin]]
name = "microswarmd"
path = "src/main.rs"

