[package]
name = "ms-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3.34"
ms-proto = { path = "../ms-proto" }
ms-store = { path = "../ms-store" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.145"
tokio = { version = "1.53.2", features = ["io-util", "time"] }

[lib]
path = "src/lib.rs"
