[package]
name = "ms-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ms-proto = { path = "../ms-proto" }
http = "1.3.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "service", "http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.145"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt", "time"] }

[[test]]
name = "cli-channel"
path = "tests/cli_channel.rs"

[[test]]
name = "telegram-channel"
path = "tests/telegram_channel.rs"

[[test]]
name = "webhook-channel"
path = "tests/webhook_channel.rs"
