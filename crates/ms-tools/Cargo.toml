[package]
name = "ms-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.2", features = ["macros", "net", "process", "rt", "time"] }

[[bin]]
name = "microswarm-tools"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[test]]
name = "fs-tools"
path = "tests/fs_tools.rs"
