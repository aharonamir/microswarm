name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Check dependency policy
        run: scripts/dep-gate.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build host binaries for integration tests
        run: cargo build --workspace --bins
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build static musl binaries
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p ms-agent -p ms-tools

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dependency policy
        run: scripts/dep-gate.sh
      - name: Build the base agent image
        run: docker build --tag microswarm-agent:dev --file images/agent.Containerfile .
      - name: Build the Python-enabled integration image
        run: docker build --tag microswarm-agent-python:dev --file tests/fixtures/us5-python-agent.Containerfile .
      - name: Run runtime integration suite
        env:
          MS_REQUIRE_RUNTIME: "1"
          MS_TEST_AGENT_IMAGE: microswarm-agent-python:dev
        run: cargo test --workspace --all-targets

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Check dependency policy
        run: scripts/dep-gate.sh
      - name: Resolve comparison revision
        id: baseline
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
          elif [[ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            BASE_SHA='${{ github.event.before }}'
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags origin "$BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$BASE_SHA:crates/ms-bench/tests/performance.rs" 2>/dev/null; then
            git worktree add --detach /tmp/microswarm-benchmark-baseline "$BASE_SHA"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "The base revision has no performance benchmark; this run establishes the first baseline."
          fi
      - name: Build baseline binaries and image
        if: steps.baseline.outputs.available == 'true'
        working-directory: /tmp/microswarm-benchmark-baseline
        run: |
          cargo build --locked --release --workspace --bins
          cargo build --locked --release --target x86_64-unknown-linux-musl -p ms-agent -p ms-tools
          docker build --tag microswarm-agent:baseline --file images/agent.Containerfile .
      - name: Build current binaries and image
        run: |
          cargo build --locked --release --workspace --bins
          cargo build --locked --release --target x86_64-unknown-linux-musl -p ms-agent -p ms-tools
          docker build --tag microswarm-agent:current --file images/agent.Containerfile .
      - name: Measure baseline commit
        if: steps.baseline.outputs.available == 'true'
        working-directory: /tmp/microswarm-benchmark-baseline
        env:
          MS_REQUIRE_RUNTIME: "1"
          MS_TEST_RUNTIME: docker
          MS_TEST_AGENT_IMAGE: microswarm-agent:baseline
          MS_TEST_SUPERVISORD: /tmp/microswarm-benchmark-baseline/target/release/microswarmd
          MS_BENCH_RUNNER: ubuntu-latest
          MS_BENCH_REVISION: ${{ steps.baseline.outputs.sha }}
          MS_BENCH_AGENT_IMAGE: microswarm-agent:baseline
          MS_BENCH_AGENT_BINARY: /tmp/microswarm-benchmark-baseline/target/x86_64-unknown-linux-musl/release/microswarm-agent
          MS_BENCH_OUTPUT: ${{ github.workspace }}/benchmark-baseline.json
        run: cargo test --locked --release -p ms-bench --features measure --test performance collect_phase9_performance_report -- --exact --nocapture
      - name: Measure current commit
        env:
          MS_REQUIRE_RUNTIME: "1"
          MS_TEST_RUNTIME: docker
          MS_TEST_AGENT_IMAGE: microswarm-agent:current
          MS_TEST_SUPERVISORD: ${{ github.workspace }}/target/release/microswarmd
          MS_BENCH_RUNNER: ubuntu-latest
          MS_BENCH_REVISION: ${{ github.sha }}
          MS_BENCH_AGENT_IMAGE: microswarm-agent:current
          MS_BENCH_AGENT_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/microswarm-agent
          MS_BENCH_OUTPUT: ${{ github.workspace }}/benchmark-current.json
        run: cargo test --locked --release -p ms-bench --features measure --test performance collect_phase9_performance_report -- --exact --nocapture
      - name: Fail on performance regression above 20 percent
        if: steps.baseline.outputs.available == 'true'
        run: target/release/ms-bench compare benchmark-baseline.json benchmark-current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microswarm-performance-${{ github.sha }}
          path: |
            benchmark-baseline.json
            benchmark-current.json
          if-no-files-found: ignore
