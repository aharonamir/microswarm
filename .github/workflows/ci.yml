name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Check dependency policy
        run: scripts/dep-gate.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build host binaries for integration tests
        run: cargo build --workspace --bins
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build static musl binaries
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p ms-agent -p ms-tools

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dependency policy
        run: scripts/dep-gate.sh
      - name: Build the base agent image
        run: docker build --tag microswarm-agent:dev --file images/agent.Containerfile .
      - name: Build the Python-enabled integration image
        run: docker build --tag microswarm-agent-python:dev --file tests/fixtures/us5-python-agent.Containerfile .
      - name: Run runtime integration suite
        env:
          MS_REQUIRE_RUNTIME: "1"
          MS_TEST_AGENT_IMAGE: microswarm-agent-python:dev
        run: cargo test --workspace --all-targets
